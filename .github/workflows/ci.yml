name: CyberWatch validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python run.py demo --no-server
      - run: python -m compileall -q cyberwatch jobs scripts
  spark-iceberg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -r requirements-bigdata.txt
      - name: Actual Iceberg batch, replay and Structured Streaming integration
        env:
          PYTHONPATH: .
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_SUBMIT_ARGS: --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.2 pyspark-shell
        run: python tests/spark_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: spark-integration-evidence
          path: reports/spark_integration.json
