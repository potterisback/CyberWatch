name: CyberWatch validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Verify project source layout
        shell: bash
        run: |
          if [[ ! -f pyproject.toml || ! -f cyberwatch/__init__.py || ! -f cyberwatch/detection.py ]]; then
            echo "::error::Incomplete project. Copy pyproject.toml and the complete lowercase cyberwatch/ folder to the repository root, next to run.py and tests/."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CyberWatch and ML dependencies
        run: python -m pip install -e ".[ml]"
      - name: Verify installed package import
        run: python -I -c "from cyberwatch.detection import Detector; print('CyberWatch import OK')"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python run.py demo --no-server
      - run: python -m compileall -q cyberwatch jobs scripts
  spark-iceberg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify project source layout
        shell: bash
        run: |
          if [[ ! -f pyproject.toml || ! -f cyberwatch/__init__.py || ! -f cyberwatch/detection.py ]]; then
            echo "::error::Incomplete project. Copy pyproject.toml and the complete lowercase cyberwatch/ folder to the repository root, next to run.py and tests/."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install CyberWatch and Big Data dependencies
        run: python -m pip install -e ".[bigdata]"
      - name: Verify installed package import
        run: python -I -c "from cyberwatch.spark_pipeline import session; print('CyberWatch Spark import OK')"
      - name: Actual Iceberg batch, replay and Structured Streaming integration
        env:
          PYTHONPATH: .
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_SUBMIT_ARGS: --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.2 pyspark-shell
        run: python tests/spark_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: spark-integration-evidence
          path: reports/spark_integration.json
